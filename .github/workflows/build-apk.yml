name: Build Nawaqes APK

on:
  push:
    branches: [ main ]
    paths:
      - 'nawaqes-apk/webview-apk/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'

    - name: Grant execute permission for gradlew
      run: chmod +x nawaqes-apk/webview-apk/gradlew

    - name: Build Debug APK
      working-directory: nawaqes-apk/webview-apk
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Build Release APK
      working-directory: nawaqes-apk/webview-apk
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: nawaqes-debug-v3.0.0
        path: nawaqes-apk/webview-apk/app/build/outputs/apk/debug/*.apk
        retention-days: 90

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: nawaqes-release-v3.0.0
        path: nawaqes-apk/webview-apk/app/build/outputs/apk/release/*.apk
        retention-days: 90
